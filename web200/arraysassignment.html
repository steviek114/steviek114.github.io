<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple List Manager</title>
    <link rel="stylesheet" href="styles.css">
    <script src="week9script.js" defer></script>
</head>
<body>

    <h1>Simple List Manager</h1>

    <input type="text" id="itemInput" placeholder="Enter an item">

    <button id="addButton">Add Item</button>
    <button id="removeButton">Remove Last Item</button>
    <button id="sortButton">Sort List</button>

    <h2>Current List</h2>
    <ul id="itemList"></ul>

    <h2>Current Array</h2>
    <p id="arrayDisplay"></p>

</body>
</html>
